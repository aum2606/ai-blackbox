[project]
name = "ai-blackbox-lab"
version = "0.0.0"
description = "Research-grade observability, interpretability and causal debugging for AI systems"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added by the step that first uses them.
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.1",
    "openinference-semantic-conventions>=0.1.46",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]
neural = [
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # docs hold illustrative, non-runnable snippets

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the pytest idiom

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not neural\""
markers = ["neural: needs the neural dependency group and a cached model (uv sync --group neural; pytest -m neural)"]

# Makes the in-repo packages importable by the CLI and API without PYTHONPATH tweaks.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["apps/api", "apps/demo_rag", "packages"]

[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/blackbox_api",
    "apps/demo_rag/demo_rag",
    "packages/evidence_store",
    "packages/run_registry",
    "packages/trace_schema",
    "packages/trace_ingest",
]
